####################################
# Port & Project Name
####################################
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  url: http://localhost:8080   # 운영에선 실제 도메인으로 교체
  mail:
    enabled: true              # 기본값(운영용): 전송 ON
  oauth2:
    redirect: http://localhost:5173/oauth-success
    fail: http://localhost:5173/oauth-fail

  ####################################
  # File Upload (기본값)
  ####################################
  # ⚠️ 설정이 하나도 없을 때 사용할 "안전한 기본값"
  # 실제 개발/운영에서는 application-local.yml, application-prod.yml 등에서 덮어쓰기
  upload-dir: "/tmp/uploads"

spring:
  application:
    name: PalDari_Backend

  ####################################
  # Active Profile
  ####################################
  profiles:
    active: local   # 🔥 application-local.yml 같이 로드되게 함

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 148127187919-rtquq5ti1l14vqte2drpou34j074om6k.apps.googleusercontent.com
            client-secret: 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 # ⚠ 재발급 필요.. 노출됨!
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile
        provider:
          google:
            issuer-uri: https://accounts.google.com
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  mail:
    host: smtp.gmail.com
    port: 587
    username: paldari2023@gmail.com
    password: ktbw hjvi ldyf supy   # 2단계 인증 켠 후 앱 비밀번호 사용
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  output:
    ansi:
      enabled: always

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

  ####################################
  # MySQL
  ####################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/paldari_db?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 1234

  ####################################
  # JPA
  ####################################
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update      # create, update, ...
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ####################################
  # File Upload (Multipart)
  ####################################
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

# ✅ ⛔️ 여기 있던 file.upload-dir 블록은 제거함
