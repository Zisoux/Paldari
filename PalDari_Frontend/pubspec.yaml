name: paldari
description: "심화응용프로젝트"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # 네트워크
  http: ^1.5.0           # ← 파일 업로드용 MultipartRequest 사용 (업데이트)
  dio: ^5.5.0

  # STOMP (실시간)
  stomp_dart_client: ^3.0.1

  # UI/상태
  cupertino_icons: ^1.0.8
  provider: ^6.1.2

  # 외부 링크/브라우저 오픈
  url_launcher: ^6.3.0

  # 보안 저장소(JWT 등)
  flutter_secure_storage: ^9.2.2

  # OAuth(모바일/데스크탑용 콜백 스킴 처리)
  flutter_web_auth_2: ^4.1.0

  # ⬇️ 파일 업로드용 (NewPostScreen에서 사용)
  file_picker: ^8.0.0
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/
